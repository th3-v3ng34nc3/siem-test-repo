apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: dashboard-yoma-fleet
  annotations:
    # If using Nginx Ingress, these annotations help manage path stripping
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: us.siem.v2.accuknox.com
    http:
      paths:
      - path: /dashboards/yoma-fleet
        pathType: Prefix
        backend:
          service:
            name: grafana-dash
            port:
              number: 80