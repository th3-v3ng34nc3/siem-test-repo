apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-cloudtrail
  namespace: tenant-digitap-ai
  annotations:
    tenant: digitap-ai
    collector: cloudtrail
    type: aws
    env: in-prod-siem-v2
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/rewrites: "serviceName=aws-cloudtrail rewrite=/loki/api/v1/raw"
    nginx.org/auth-type: "basic"
    nginx.org/auth-secret: "htpasswd"
    nginx.org/client-max-body-size: "50m"
spec:
  rules:
    - host: in.siem.v2.accuknox.com
      http:
        paths:
          - path: /in-prod-siem-v2/digitap-ai/79f1cd2fb0f7b0dbbb0bc2e893206159216456a1784d697c89e2849a/cloudtrail/push
            pathType: Prefix
            backend:
              service:
                name: aws-cloudtrail
                port:
                  number: 9090