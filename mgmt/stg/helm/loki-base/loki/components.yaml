
deploymentMode: Distributed

# Disable minio storage
minio:
    enabled: false
ingester:
  replicas: 3
  kind: StatefulSet
  persistence:
    enabled: true
    claims:
      - name: data
        accessModes:
          - ReadWriteOnce
        size: 150Gi
  zoneAwareReplication:
    enabled: false
  chunk_encoding: snappy
querier:
  replicas: 3
  maxUnavailable: 2
  max_concurrent: 14
queryFrontend:
  replicas: 2
  maxUnavailable: 1
queryScheduler:
  replicas: 2
distributor:
  replicas: 1
  maxUnavailable: 2
compactor:
  replicas: 1
indexGateway:
  replicas: 2
  maxUnavailable: 1

bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0

ruler:
  replicas: 3
  maxUnavailable: 1

chunksCache:
  enabled: true
  allocatedMemory: 1000
  l2:
    allocatedMemory: 1000
    enabled: true

resultsCache:
  enabled: true
  allocatedMemory: 3000

gateway:
  replicas: 3
  service:
    type: ClusterIP
  basicAuth:
    enabled: true
  nginxConfig:
    clientMaxBodySize: 100M
