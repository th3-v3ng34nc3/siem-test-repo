apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-password
  namespace: tenant-se-team
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend # AWS, Vault, etc.
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: tenants/se-team/loki_tenant
        property: username
    - secretKey: password
      remoteRef:
        key: tenants/se-team/loki_tenant
        property: password