apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-azure
  namespace: tenant-validation
  labels:
    tenant: validation
    collector: azure
    type: azure
spec:
  selector:
    matchLabels:
      app: azure-azure
  template:
    metadata:
      labels:
        app: azure-azure
    spec:
      volumes:
        - name:  azure-alloy-azure
          secret:
            secretName:  azure-alloy-azure
        - name: azure-logstash-azure
          secret:
            secretName: azure-logstash-azure
      containers:
      - name: alloy
        image: grafana/alloy:v1.12.2
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --disable-reporting
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
          - name: azure-alloy-azure
            readOnly: true
            mountPath: /etc/alloy/
      - name: logstash
        image: public.ecr.aws/k9v9d5v2/admin-tools/crd-collectors/logstash:v1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9091
        readinessProbe:
          httpGet:
            path: /
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 10
        args:
          - "-f"
          - "/configs/pipeline.conf"
        volumeMounts:
          - name: azure-logstash-azure
            readOnly: true
            mountPath: /configs/
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m" 
