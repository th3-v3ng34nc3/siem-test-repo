apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-cloudwatch
  namespace: tenant-validation
  annotations:
    tenant: validation
    collector: cloudwatch
    type: aws
    env: us-prod-siem-v2
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/rewrites: "serviceName=aws-cloudwatch rewrite=/loki/api/v1/raw"
    nginx.org/auth-type: "basic"
    nginx.org/auth-secret: "htpasswd"
    nginx.org/client-max-body-size: "50m"
spec:
  rules:
    - host: us.siem.v2.accuknox.com
      http:
        paths:
          - path: /us-prod-siem-v2/validation/c4ef42fb1d550176e2b8f2d915646cd0e8ca1a363ea44cd8a913c335/cloudwatch/push
            pathType: Prefix
            backend:
              service:
                name: aws-cloudwatch
                port:
                  number: 9090