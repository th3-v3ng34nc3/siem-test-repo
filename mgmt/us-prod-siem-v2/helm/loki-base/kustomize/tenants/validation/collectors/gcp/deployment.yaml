apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcp-gcp
  namespace: tenant-validation
  labels:
    tenant: validation
    collector: gcp
    type: gcp
spec:
  selector:
    matchLabels:
      app: gcp-gcp
  template:
    metadata:
      labels:
        app: gcp-gcp
    spec:
      volumes:
        - name:  gcp-alloy-gcp
          secret:
            secretName:  gcp-alloy-gcp
        - name: gcp-logstash-gcp
          secret:
            secretName: gcp-logstash-gcp
        - name: gcp-key-gcp
          secret:
            secretName: gcp-key-gcp
      containers:
      - name: alloy
        image: grafana/alloy:v1.12.2
        imagePullPolicy: IfNotPresent
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --disable-reporting
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
          - name: gcp-alloy-gcp
            readOnly: true
            mountPath: /etc/alloy/
      - name: logstash
        image: public.ecr.aws/k9v9d5v2/admin-tools/crd-collectors/logstash:v1.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9091
        readinessProbe:
          httpGet:
            path: /
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 10
        args:
          - "-f"
          - "/configs/pipeline.conf"
        volumeMounts:
          - name: gcp-logstash-gcp
            readOnly: true
            mountPath: /configs/
          - name: gcp-key-gcp
            readOnly: true
            mountPath: /gcp/
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m" 
