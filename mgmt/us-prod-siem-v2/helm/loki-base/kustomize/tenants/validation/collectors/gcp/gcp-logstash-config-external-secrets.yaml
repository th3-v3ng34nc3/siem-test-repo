apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-logstash-gcp
  namespace: tenant-validation
  annotations:
    tenant: validation
    collector: gcp
    type: gcp
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore  # or ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        pipeline.conf: |
          input {
            google_pubsub {
              project_id        => "{{ .project }}"
              topic             => "{{ .topic }}"
              subscription      => "{{ .subscription }}"

              json_key_file     => "/gcp/key.json"

              max_messages      => 100
              ack               => true
              create_subscription => false
              type              => "gcp"
            }

            http {
              port => 9091
              type => "readiness"
            }
          }

          filter {
              if [type] == "readiness"{
                drop {}
              }
            # Example: If your Pub/Sub messages are JSON, parse them
              json {
                source => "message"
                #target => "parsed_data"
              }

              if [type] == "azure" {
                split {
                  field => "[records]"
                }
                geoip {
                  source => "[records][callerIpAddress]"
                  target => "[geoip]"
                }
                mutate{
                  replace => {"message" => "%{records}"}
                }
              } else if [type] == "gcp"{
                geoip {
                  source => "[protoPayload][requestMetadata][callerIp]"
                  target => "[geoip]"
                }
              }
            mutate{
                remove_field =>["[event]", "[message]" ]
              }
          }

          output {
            http {
              url => "http://localhost:8080/loki/api/v1/raw"
              http_method => "post"
              format => "json"
              content_type => "application/json"
            }
          }

  data:
  - secretKey: project
    remoteRef:
      key: tenants/validation/gcp/gcp/info
      property: project
      decodingStrategy: None
  - secretKey: topic
    remoteRef:
      key: tenants/validation/gcp/gcp/info
      property: topic
      decodingStrategy: None
  - secretKey: subscription
    remoteRef:
      key: tenants/validation/gcp/gcp/info
      property: subscription
      decodingStrategy: None
