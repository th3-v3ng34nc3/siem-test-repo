apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-key-gcp
  namespace: tenant-validation
  annotations:
    tenant: validation
    collector: gcp
    type: gcp
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore  # or ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key.json:  |
          {{ .key | b64dec }}

  data:
  - secretKey: key
    remoteRef:
      key: tenants/validation/gcp/gcp/key
      property: key
      decodingStrategy: None

