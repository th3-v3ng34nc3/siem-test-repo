apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-cloudtrail
  namespace: tenant-yoma-fleet
  annotations:
    tenant: yoma-fleet
    collector: cloudtrail
    type: aws
    env: us-prod-siem-v2
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/rewrites: "serviceName=aws-cloudtrail rewrite=/loki/api/v1/raw"
    nginx.org/auth-type: "basic"
    nginx.org/auth-secret: "htpasswd"
spec:
  rules:
    - host: us.siem.v2.accuknox.com
      http:
        paths:
          - path: /us-prod-siem-v2/yoma-fleet/988de449877209cf802b3242dda4acdfb5028872e62fe0396cf7711a/cloudtrail/push
            pathType: Prefix
            backend:
              service:
                name: aws-cloudtrail
                port:
                  number: 9090