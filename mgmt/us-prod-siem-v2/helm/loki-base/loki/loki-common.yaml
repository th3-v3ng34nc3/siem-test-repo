loki:
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
      enabled: true
  limits_config:
    ingestion_rate_mb: 50
    ingestion_burst_size_mb: 100
    max_line_size: "256kb"
    max_query_parallelism: 32
    split_queries_by_interval: 15m
    allow_structured_metadata: true
    volume_enabled: true
    query_timeout: 5m
    retention_period: 90d # 28 days retention
    deletion_mode: filter-only
  ingester:
    chunk_encoding: snappy
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 8
  server:
    http_server_read_timeout: 600s
    http_server_write_timeout: 600s

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus