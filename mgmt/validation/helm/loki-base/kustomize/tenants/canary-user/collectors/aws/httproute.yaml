apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-aws
  namespace: tenant-canary-user
  annotations:
    tenant: canary-user
    collector: aws
    type: aws
    env: validation
    kubernetes.io/ingress.class: "nginx"
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/rewrites: "serviceName=aws-aws rewrite=/loki/api/v1/raw"
    nginx.org/auth-type: "basic"
    nginx.org/auth-secret: "htpasswd"
spec:
  rules:
    - host: siem.v2.validation.accuknox.com
      http:
        paths:
          - path: /validation/canary-user/929d964155b5e11a02a988eea317810061caac6034c2980436e6cb49/aws/push
            pathType: Prefix
            backend:
              service:
                name: aws-aws
                port:
                  number: 9090