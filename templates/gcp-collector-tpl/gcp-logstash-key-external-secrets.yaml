apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcp-key-<intergation_id>
  namespace: tenant-<tenant_id>
  annotations:
    tenant: <tenant_id>
    collector: <intergation_id>
    type: gcp
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore  # or ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: "1h"
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        key.json:  |
          {{ .key | b64dec }}

  data:
  - secretKey: key
    remoteRef:
      key: tenants/<tenant_id>/gcp/<intergation_id>/key
      property: key
      decodingStrategy: None

