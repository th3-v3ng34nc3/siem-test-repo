    resolve_timeout: 10s
  route:
    receiver: external-api
    group_by: ['...']
    group_wait: 0s
    group_interval: 1s
    repeat_interval: 60s
  receivers:
    - name: external-api
      webhook_configs:
        - url: "http://accuknox-retriver.accuknox-retriver.svc:8080/v1/alerts/alertsmanager"
          send_resolved: false
